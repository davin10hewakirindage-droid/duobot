name: Daily Duolingo Cloud Bot
on:
  schedule:
    # Triggers the cloud bot automatically every day at 7:00 PM UTC (8:00 PM BST)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows you to manually trigger a run whenever you want

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Install Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 2. Install Duolingo Bot Packages
        run: |
          python -m pip install --upgrade pip
          pip install duolingo-bot
          playwright install chromium

      - name: 3. Run the Bot Engine
        env:
          DUO_USERID: ${{ secrets.DUO_USERID }}
          DUO_AUTH: ${{ secrets.DUO_AUTH }}
        run: |
          python -m duolingo_bot --lessons 1000
